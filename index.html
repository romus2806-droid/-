<script>

function cfg(l){const e=l<=20,b=l%5===0,m=Math.max(18,31-Math.floor(l/3))-(b?e?1:2:0)+(e?Math.ceil((21-l)/5):0),p=(26+Math.min(l,80)*.5)*(b?1.15:1)*(e?.75+.25*l/21:1);return{colors:Math.min(6,4+Math.floor((l-1)/(e?6:3))),moves:m,target:Math.round(m*p/50)*50,ice:l<(e?6:4)?0:e?Math.floor((l-5)*1.1):Math.min(l<40?16:22,Math.floor((l-3)*1.6)),lock:l<(e?9:6)?0:e?Math.floor((l-8)/2):Math.min(l<40?7:10,l-5),col:l>=8&&l%7===3?{t:l%4,n:Math.min(60,20+(l>>1))}:0,keys:l>=12&&l%7===5?Math.min(6,2+(l>>4)):0,pri:l>=14&&l%7===0?Math.min(8,3+(l>>4)):0}}

}
